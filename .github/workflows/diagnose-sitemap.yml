name: Diagnose live sitemap
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live sitemap
        shell: bash
        run: |
          set -x
          echo "=== NORMAL UA: sitemap headers ==="
          curl -sS -L -D - -o /tmp/sitemap-normal.xml --max-time 30 https://movieanchor.com/sitemap.xml | head -80
          echo "=== NORMAL UA: sitemap first lines ==="
          head -8 /tmp/sitemap-normal.xml
          echo "=== NORMAL UA: size ==="
          wc -c /tmp/sitemap-normal.xml

          echo "=== GOOGLEBOT UA: sitemap headers ==="
          curl -sS -L -A "Googlebot/2.1 (+http://www.google.com/bot.html)" -D - -o /tmp/sitemap-googlebot.xml --max-time 30 https://movieanchor.com/sitemap.xml | head -80
          echo "=== GOOGLEBOT UA: sitemap first lines ==="
          head -8 /tmp/sitemap-googlebot.xml
          echo "=== GOOGLEBOT UA: size ==="
          wc -c /tmp/sitemap-googlebot.xml

          echo "=== robots.txt ==="
          curl -sS -L -D - --max-time 30 https://movieanchor.com/robots.txt | head -80

          echo "=== homepage ==="
          curl -sS -I -L --max-time 30 https://movieanchor.com/
      - name: Remove one-time diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-sitemap.yml
          git commit -m "Remove one-time sitemap diagnostic workflow"
          git push
