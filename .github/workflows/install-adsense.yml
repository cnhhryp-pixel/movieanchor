name: Install AdSense sitewide
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert AdSense into every HTML head
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          publisher = "ca-pub-4228902685584187"
          snippet = '''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4228902685584187"
               crossorigin="anonymous"></script>'''

          changed = 0
          skipped = 0
          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if publisher in text:
                  skipped += 1
                  continue
              if "</head>" not in text:
                  continue
              text = text.replace("</head>", snippet + "</head>", 1)
              path.write_text(text, encoding="utf-8")
              changed += 1

          print(f"Inserted AdSense into {changed} HTML files; skipped {skipped} already configured files.")
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-adsense.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Install AdSense code across all HTML pages"
          git push
